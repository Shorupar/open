<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kheer 😢</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fff5e6, #ffe0e0);
    font-family: 'Segoe UI', sans-serif;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  .content {
    text-align: center;
    pointer-events: none;
  }

  .content img {
    width: 220px;
    max-width: 60vw;
    display: block;
    margin: 0 auto 0.5rem;
    filter: drop-shadow(0 8px 15px rgba(0,0,0,0.2));
  }

  .title {
    font-size: 3rem;
    font-weight: bold;
    color: #6b4226;
  }

  .hint {
    margin-top: 0.5rem;
    font-size: 0.95rem;
    color: #8a6a4f;
  }

  /* Emoji burst particle */
  .particle {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 2rem;
    pointer-events: none;
    will-change: transform, opacity;
    animation: burst 1s ease-out forwards;
    z-index: 5;
  }

  @keyframes burst {
    0% {
      transform: translate(var(--startX), var(--startY)) scale(0.5);
      opacity: 1;
    }
    100% {
      transform: translate(var(--endX), var(--endY)) scale(1.3);
      opacity: 0;
    }
  }
</style>
</head>
<body id="body">

  <div class="content">
    <img src="kheer.png" alt="Kheer">
    <div class="title">Kheer 😢</div>
    <!-- <div class="hint">click anywhere</div> -->
  </div>

<script>
  const body = document.getElementById('body');
  const EMOJI = '😢';
  const PARTICLE_COUNT = 10;

  body.addEventListener('click', (e) => {
    const x = e.clientX;
    const y = e.clientY;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      spawnParticle(x, y);
    }
  });

  function spawnParticle(x, y) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = EMOJI;

    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * 120;
    const endX = Math.cos(angle) * distance;
    const endY = Math.sin(angle) * distance - 40; // slight upward bias

    el.style.setProperty('--startX', x + 'px');
    el.style.setProperty('--startY', y + 'px');
    el.style.setProperty('--endX', (x + endX) + 'px');
    el.style.setProperty('--endY', (y + endY) + 'px');

    document.body.appendChild(el);

    // Clean up after animation finishes
    el.addEventListener('animationend', () => el.remove());
  }
</script>

</body>
</html>
